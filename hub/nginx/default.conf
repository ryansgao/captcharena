# CAPTCHArena hub: static files only. Reached through the Cloudflare Tunnel on 127.0.0.1:8310 → container :8080.
log_format hub '$time_iso8601 "$request" $status $body_bytes_sent "$http_host"';

server {
    listen 8080;
    server_name www.captcharena.org;
    access_log /dev/stdout hub;
    location = /health { access_log off; default_type text/plain; return 200 "ok\n"; }
    location / { return 301 https://captcharena.org$request_uri; }
}

server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    access_log /dev/stdout hub;
    server_tokens off;
    absolute_redirect off;
    charset utf-8;
    charset_types text/css application/javascript text/plain text/xml application/xml image/svg+xml;
    gzip on;
    gzip_types text/css application/javascript text/plain text/xml application/xml image/svg+xml;
    error_page 404 /404.html;

    include /etc/nginx/snippets/security-headers.conf;

    location = /health { access_log off; default_type text/plain; return 200 "ok\n"; }

    # Pages: always revalidate, so a deploy is visible at once.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
    # Assets carry a content hash in their URL (?h=…), so they can be cached for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location = /favicon.svg {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }
    location /.well-known/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        default_type text/plain;
    }
    location = /favicon.ico { access_log off; return 404; }
}
