# CAPTCHA measurement page. Deployed to the hosting server from the owner's machine (`deploy-tool deploy`); secrets in
# .env (linked to /srv/<project>/.env on the box, never in git); the run log in the named volume `runs`.
services:
  measure:
    build: .
    image: captcha-measure:local
    ports: ["127.0.0.1:${MEASURE_PORT:-8300}:8000"]
    env_file: [.env]
    environment:
      MEASURE_LOG: /data/runs.jsonl
    volumes: [runs:/data]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 200
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 3
  # Cap (tiagozip/cap, Apache-2.0) standalone server: the fifth lane. Reached only by `measure` over the compose
  # network (/cap/<site>/challenge|redeem proxied, siteverify server-side); no published port. ADMIN_KEY in .env.
  cap:
    image: tiago2/cap:3.1.17
    environment:
      ADMIN_KEY: ${ADMIN_KEY:?ADMIN_KEY missing from .env}
      REDIS_URL: redis://valkey:6379
      RATELIMIT_IP_HEADER: cf-connecting-ip
    depends_on: [valkey]
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 384m
    pids_limit: 200
  valkey:
    image: valkey/valkey:9.0.7-alpine3.24
    command: ["valkey-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes: [capdata:/data]
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 100
volumes:
  runs:
  capdata:
